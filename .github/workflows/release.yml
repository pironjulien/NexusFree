# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main runs test.ps1 and builds the engine for Windows x64 and Arm64 (Native AOT: one
#   NexusFree.exe compiled ahead of time, no .NET to install): NexusFree-win-x64.zip and NexusFree-win-arm64.zip (the
#   engine, which installs itself and the SYSTEM dispatcher, install.ps1, the plugin files), get.ps1 and SHA256SUMS.txt.
#   product-dev-release attests them and publishes the pre-release vX.Y.Z-dev.N.
# - Stable: right after that build when its version is not released yet, or "Run workflow" (promote: a vX.Y.Z-dev.N,
#   or empty for the newest), product-promote publishes the SAME files as vX.Y.Z with the CHANGELOG section.
#   NexusFree is not sent to the MCP registry. get.ps1 installs from releases/latest.
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          global-json-file: global.json
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/NexusFree/NexusFree.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "src/NexusFree/NexusFree.csproj: no X.Y.Z version ($version)." }
          $found = [ordered]@{
            'src/NexusFree/McpServer.cs' = [regex]::Match((Get-Content src/NexusFree/McpServer.cs -Raw), 'ServerVersion = "([^"]+)"').Groups[1].Value
            'plugin/plugin.json' = (Get-Content plugin/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.claude-plugin/plugin.json' = (Get-Content plugin/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
            'plugin/.codex-plugin/plugin.json' = (Get-Content plugin/.codex-plugin/plugin.json -Raw | ConvertFrom-Json).version
          }
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch "## [$version]" -Quiet)) { throw "CHANGELOG.md has no [$version] section." }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Build and pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          # Native AOT finds the C++ linker through vswhere, which is not on PATH outside a developer prompt.
          $env:PATH = "$env:PATH;$(Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer')"
          foreach ($rid in 'win-x64', 'win-arm64') {
            $out = Join-Path $env:RUNNER_TEMP "publish-$rid"
            # PublishAot (src/NexusFree/NexusFree.csproj): one NexusFree.exe compiled ahead of time, nothing beside it.
            dotnet publish src/NexusFree/NexusFree.csproj -c Release -r $rid -p:DebugType=none -o $out
            if ($LASTEXITCODE) { throw "dotnet publish $rid failed." }
            $files = @(Get-ChildItem $out -File | ForEach-Object Name)
            if (($files -join ',') -ne 'NexusFree.exe') { throw "$rid output is not one native engine: $($files -join ', ')" }
            Copy-Item install.ps1, LICENSE, README.md, SECURITY.md $out
            Copy-Item plugin, fr $out -Recurse
            Compress-Archive -Path "$out/*" -DestinationPath "dist/NexusFree-$rid.zip"
          }
          $version = & "$env:RUNNER_TEMP/publish-win-x64/NexusFree.exe" --version
          if ($LASTEXITCODE -or $version -notmatch 'NexusFree v') { throw 'The x64 build does not start.' }
          Copy-Item get.ps1 dist  # the installer too, checked and attested like the packages
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@6a66dbe3c76ee85b4cde38f6b71c6410ec08c7e8  # v1.7.2
    with:
      product: NexusFree
      version: ${{ needs.build.outputs.version }}

  promote:
    # Right after the push that built a new version (same files), or by hand ("Run workflow").
    needs: dev
    if: always() && (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
      actions: read  # the commit's checks, read before anything is published
      checks: read
      statuses: read
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@6a66dbe3c76ee85b4cde38f6b71c6410ec08c7e8  # v1.7.2
    with:
      product: NexusFree
      promote: ${{ inputs.promote || needs.dev.outputs.tag }}
      # Promoted only once these workflows and every other check of the build's commit are green.
      required-workflows: tests.yml security.yml codeql.yml scorecard.yml
