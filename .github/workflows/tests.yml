name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running check pointless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Both release architectures on their own hardware: the Arm64 runner compiles and runs the Arm64 native engine
    # (update-while-running test, elevated setup test) instead of only cross-compiling it.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: test.ps1 (xUnit suite of the engine; no elevation needed)
        shell: pwsh
        run: ./test.ps1
